[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x", "php82", "php82Extensions.redis", "nginx", "libmysqlclient", "phpPackages.composer"]

[phases.install]
cmds = ["composer install --no-scripts --ignore-platform-reqs"]

[phases.build]
cmds = [
    "npm install",
    "CACHE_DRIVER=file SESSION_DRIVER=file php artisan wayfinder:generate --with-form || true",
    "npm run build"
]

[staticAssets]
"nginx.template.conf" = '''
user www-data www-data;
worker_processes 5;
daemon off;
worker_rlimit_nofile 8192;
events {
  worker_connections 4096;
}
http {
    include $!{nginx}/conf/mime.types;
    index index.html index.htm index.php;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr;
    sendfile on;
    tcp_nopush on;
    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;
        root /app/public;
        index index.php;
        charset utf-8;
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
        error_page 404 /index.php;
        location ~ \.php$ {
            fastcgi_buffer_size 8k;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''